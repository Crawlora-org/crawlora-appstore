[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-appstore"
version = "0.1.1"
description = "Crawlora App Store API client with 15 endpoints for app search, details, reviews, ratings, privacy labels, version history, charts, editorial collections, and developers"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "appstore", "app-store", "appstore-api", "app-store-api", "appstore-scraper", "app-store-scraper", "appstore-data", "app-store-data", "appstore-app-search", "appstore-details", "appstore-reviews", "appstore-ratings", "appstore-privacy-labels", "appstore-version-history", "appstore-charts"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=appstore-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=appstore-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-appstore"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_appstore"]

[tool.setuptools.package-data]
"crawlora_appstore" = ["py.typed", "*.pyi"]
